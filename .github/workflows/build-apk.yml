name: Build ReelSave APK

on:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34 and build tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Write the ReelSave project files
        run: |
          echo "" | base64 -d > reelsave-project.zip
          unzip -oq reelsave-project.zip
          rm reelsave-project.zip

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build the APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelSave-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
